<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>음성 테스트</title>
<style>
body{margin:0;background:#0b1020;color:#e8ecf8;font:16px/1.5 system-ui,-apple-system,'Noto Sans KR',sans-serif;padding:20px 16px calc(28px + env(safe-area-inset-bottom,0px))}
h1{font-size:22px;margin:0 0 4px}p{margin:0 0 14px;color:#9aa5c7;font-size:14px}
canvas{display:block;width:100%;height:220px;background:#141b33;border-radius:16px}
.vol{height:14px;border-radius:7px;background:#141b33;margin:14px 0;overflow:hidden}.vol i{display:block;height:100%;width:0;background:#3cc88a;transition:width .05s}
.row{display:flex;gap:10px;margin:14px 0}button{flex:1;height:54px;border:0;border-radius:16px;font:800 17px inherit;background:#eccd4c;color:#1a2139}
button.g{background:#26304f;color:#e8ecf8}
.k{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k div{background:#141b33;border-radius:14px;padding:12px}.k b{display:block;font-size:24px}.k span{font-size:12px;color:#9aa5c7}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:#c6cde6;margin:12px 0}
#log{font-size:12px;color:#9aa5c7;white-space:pre-wrap;margin-top:12px}
</style></head><body>
<h1>음성 테스트</h1><p>마이크를 누르고 "你好", "谢谢"처럼 말해 보세요. 위 막대는 소리 크기, 아래 선은 음높이(오르내림)예요.</p>
<div class="vol"><i id="vb"></i></div>
<canvas id="cv" width="800" height="440"></canvas>
<div class="k" style="margin-top:12px"><div><b id="hz">–</b><span>음높이(Hz)</span></div><div><b id="db">–</b><span>소리 크기 (0~100)</span></div></div>
<label><input type="checkbox" id="sr"> 음성 인식도 같이 켜기 (안 끊기는지 확인용)</label>
<div class="row"><button id="go">마이크 시작</button><button id="stop" class="g">멈추기</button></div>
<div id="log"></div>
<script>
var cv=document.getElementById('cv'),cx=cv.getContext('2d'),hz=document.getElementById('hz'),dbEl=document.getElementById('db'),vb=document.getElementById('vb'),logEl=document.getElementById('log');
var ac,an,stream,raf,buf,pts=[],rec=null,W=cv.width,H=cv.height;
function log(t){logEl.textContent=t+'\n'+logEl.textContent.split('\n').slice(0,8).join('\n')}
function pitch(b,sr){
  var n=b.length,rms=0,i,lag;for(i=0;i<n;i++)rms+=b[i]*b[i];rms=Math.sqrt(rms/n);if(rms<0.012)return {f:0,rms:rms};
  var minL=Math.floor(sr/500),maxL=Math.floor(sr/70),best=0,bl=0,c=new Float32Array(maxL+1);
  for(lag=minL;lag<=maxL;lag++){var s=0;for(i=0;i<n-lag;i++)s+=b[i]*b[i+lag];c[lag]=s}
  for(lag=minL;lag<=maxL;lag++){if(c[lag]>best){best=c[lag];bl=lag}}
  var e0=0;for(i=0;i<n;i++)e0+=b[i]*b[i];
  if(!bl||best/e0<0.45)return {f:0,rms:rms};
  return {f:sr/bl,rms:rms};
}
function draw(){
  an.getFloatTimeDomainData(buf);
  var r=pitch(buf,ac.sampleRate),db=r.rms>0?20*Math.log10(r.rms):-90;
  vb.style.width=Math.max(0,Math.min(100,(db+60)/50*100))+'%';dbEl.textContent=Math.round(Math.max(0,Math.min(100,(db+60)/50*100)));
  if(r.f){hz.textContent=Math.round(r.f)}else hz.textContent='–';
  pts.push(r.f?Math.log2(r.f):null);if(pts.length>240)pts.shift();
  cx.clearRect(0,0,W,H);cx.strokeStyle='#26304f';cx.lineWidth=2;
  for(var g=1;g<4;g++){cx.beginPath();cx.moveTo(0,H*g/4);cx.lineTo(W,H*g/4);cx.stroke()}
  var v=pts.filter(Boolean),lo=7,hi=8.6;  // 약 128~388Hz, 벗어나면 가장자리에 붙여요
  cx.strokeStyle='#eccd4c';cx.lineWidth=5;cx.lineJoin='round';cx.lineCap='round';cx.beginPath();var pen=false;
  pts.forEach(function(p,i){if(p==null){pen=false;return}var x=i/239*W,y=H-(Math.max(lo,Math.min(hi,p))-lo)/(hi-lo)*H;if(!pen){cx.moveTo(x,y);pen=true}else cx.lineTo(x,y)});
  cx.stroke();raf=requestAnimationFrame(draw);
}
document.getElementById('go').onclick=async function(){
  try{
    if(stream)return;
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    ac=new (window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=2048;buf=new Float32Array(an.fftSize);
    ac.createMediaStreamSource(stream).connect(an);pts=[];draw();log('마이크 켜짐');
    if(document.getElementById('sr').checked){
      var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){log('이 브라우저는 음성 인식을 지원하지 않아요')}else{
        rec=new SR();rec.lang='zh-CN';rec.continuous=true;rec.interimResults=true;
        rec.onresult=function(e){var t='';for(var i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;log('인식: '+t)};
        rec.onerror=function(e){log('인식 오류: '+e.error)};rec.onend=function(){log('인식 끝')};
        rec.start();log('음성 인식 시작 (같이 켜짐)');
      }
    }
  }catch(e){log('마이크를 켤 수 없어요: '+(e&&e.name||e))}
};
document.getElementById('stop').onclick=function(){
  cancelAnimationFrame(raf);if(rec){try{rec.stop()}catch(e){}rec=null}
  if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}if(ac){ac.close();ac=null}
  vb.style.width='0';hz.textContent='–';dbEl.textContent='–';log('멈춤');
};
</script></body></html>
