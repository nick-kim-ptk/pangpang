<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>음성 테스트</title>
<style>
body{margin:0;background:#0b1020;color:#e8ecf8;font:16px/1.5 system-ui,-apple-system,'Noto Sans KR',sans-serif;padding:20px 16px calc(28px + env(safe-area-inset-bottom,0px))}
h1{font-size:22px;margin:0 0 4px}p{margin:0 0 14px;color:#9aa5c7;font-size:14px}
.stage{position:relative;border-radius:24px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#1b2547,#0b1020)}canvas{display:block;width:100%;height:280px}#msg{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-weight:800;font-size:17px;color:#e8ecf8;transition:color .2s}
.vol{height:14px;border-radius:7px;background:#141b33;margin:14px 0;overflow:hidden}.vol i{display:block;height:100%;width:0;background:#3cc88a;transition:width .05s}
.row{display:flex;gap:10px;margin:14px 0}button{flex:1;height:54px;border:0;border-radius:16px;font:800 17px inherit;background:#eccd4c;color:#1a2139}
button.g{background:#26304f;color:#e8ecf8}
.k{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k div{background:#141b33;border-radius:14px;padding:12px}.k b{display:block;font-size:24px}.k span{font-size:12px;color:#9aa5c7}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:#c6cde6;margin:12px 0}
#log{font-size:12px;color:#9aa5c7;white-space:pre-wrap;margin-top:12px}
</style></head><body>
<h1>음성 테스트</h1><p>마이크를 켜고 "你好", "谢谢"처럼 말해 보세요. 소리가 클수록 물결이 커지고, 목소리가 높을수록 색이 바뀌어요.</p>
<div class="stage"><canvas id="cv" width="900" height="560"></canvas><div id="msg">마이크를 켜 주세요</div></div>
<div class="k" style="margin-top:12px"><div><b id="hz">–</b><span>음높이(Hz)</span></div><div><b id="db">–</b><span>소리 크기 (0~100)</span></div></div>
<label><input type="checkbox" id="sr"> 음성 인식도 같이 켜기 (안 끊기는지 확인용)</label>
<div class="row"><button id="go">마이크 시작</button><button id="stop" class="g">멈추기</button></div>
<div id="log"></div>
<script>
var cv=document.getElementById('cv'),cx=cv.getContext('2d'),hz=document.getElementById('hz'),dbEl=document.getElementById('db'),vb=null,logEl=document.getElementById('log');
var ac,an,stream,raf,buf,rec=null;
function log(t){logEl.textContent=t+'\n'+logEl.textContent.split('\n').slice(0,8).join('\n')}
function pitch(b,sr){
  var n=b.length,rms=0,i,lag;for(i=0;i<n;i++)rms+=b[i]*b[i];rms=Math.sqrt(rms/n);if(rms<0.012)return {f:0,rms:rms};
  var minL=Math.floor(sr/500),maxL=Math.floor(sr/70),best=0,bl=0,c=new Float32Array(maxL+1);
  for(lag=minL;lag<=maxL;lag++){var s=0;for(i=0;i<n-lag;i++)s+=b[i]*b[i+lag];c[lag]=s}
  for(lag=minL;lag<=maxL;lag++){if(c[lag]>best){best=c[lag];bl=lag}}
  var e0=0;for(i=0;i<n;i++)e0+=b[i]*b[i];
  if(!bl||best/e0<0.45)return {f:0,rms:rms};
  return {f:sr/bl,rms:rms};
}
var amp=0,ph=0,hue=48,hzS=0,ring=0,lastVoice=0;
function draw(t){
  an.getFloatTimeDomainData(buf);
  var r=pitch(buf,ac.sampleRate),db=r.rms>0?20*Math.log10(r.rms):-90,lvl=Math.max(0,Math.min(1,(db+60)/45));
  // 커질 땐 빠르게, 줄 땐 천천히 따라가서 부드러운 물결로 보여요
  amp+=(lvl-amp)*(lvl>amp?0.35:0.08);
  if(r.f){hzS=hzS?hzS+(r.f-hzS)*0.25:r.f;lastVoice=performance.now()}else if(performance.now()-lastVoice>400)hzS=0;
  var tgt=hzS?Math.max(0,Math.min(1,(Math.log2(hzS)-6.8)/1.8)):0.35;      // 낮은 목소리 0 ~ 높은 목소리 1
  hue+=((hzS?200-tgt*160:48)-hue)*0.12;                                    // 낮으면 파랑, 높으면 주황·노랑
  ph+=0.04+amp*0.12+tgt*0.03;
  vb&&0;hz.textContent=hzS?Math.round(hzS):'–';dbEl.textContent=Math.round(lvl*100);
  var w=cv.width,h=cv.height,mid=h*0.46;cx.clearRect(0,0,w,h);
  cx.globalCompositeOperation='lighter';
  var L=[[1,0,0.9,1.0],[1.6,1.7,0.6,0.8],[2.3,3.1,0.4,0.6]];
  L.forEach(function(l,k){
    cx.beginPath();
    for(var x=0;x<=w;x+=6){
      var u=x/w,env=Math.pow(Math.sin(Math.PI*u),1.6);                      // 양 끝은 잔잔하게, 가운데가 크게
      var y=mid+Math.sin(u*Math.PI*2*l[0]*1.4+ph*(k%2?-1:1)*l[3]+l[1])*env*(10+amp*h*0.34)*l[2];
      x?cx.lineTo(x,y):cx.moveTo(x,y);
    }
    var hh=hue+k*22;
    cx.strokeStyle='hsla('+hh+',90%,'+(58+amp*10)+'%,'+(0.35+amp*0.55)+')';cx.lineWidth=5-k*1.2+amp*5;cx.lineJoin='round';cx.shadowColor='hsl('+hh+',95%,60%)';cx.shadowBlur=14+amp*26;cx.stroke();
  });
  cx.shadowBlur=0;cx.globalCompositeOperation='source-over';
  // 음높이를 점 하나로: 위로 갈수록 높은 목소리
  if(hzS){var py=h*0.86-tgt*h*0.18*1.0;cx.fillStyle='hsl('+hue+',95%,62%)';cx.beginPath();cx.arc(w/2,py,10+amp*8,0,7);cx.fill()}
  // 상태 문구
  var m=document.getElementById('msg');
  if(lvl<0.08&&!hzS){m.textContent='말해 보세요';m.style.color='#9aa5c7'}
  else if(lvl<0.3){m.textContent='조금 더 크게 말해 보세요';m.style.color='#eccd4c'}
  else if(lvl>0.92){m.textContent='조금 작게 말해 보세요';m.style.color='#ff8a8f'}
  else{m.textContent=hzS?'좋아요!':'듣고 있어요';m.style.color='#3cc88a'}
  raf=requestAnimationFrame(draw);
}
document.getElementById('go').onclick=async function(){
  try{
    if(stream)return;
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    ac=new (window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=2048;buf=new Float32Array(an.fftSize);
    ac.createMediaStreamSource(stream).connect(an);draw();log('마이크 켜짐');
    if(document.getElementById('sr').checked){
      var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){log('이 브라우저는 음성 인식을 지원하지 않아요')}else{
        rec=new SR();rec.lang='zh-CN';rec.continuous=true;rec.interimResults=true;
        rec.onresult=function(e){var t='';for(var i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;log('인식: '+t)};
        rec.onerror=function(e){log('인식 오류: '+e.error)};rec.onend=function(){log('인식 끝')};
        rec.start();log('음성 인식 시작 (같이 켜짐)');
      }
    }
  }catch(e){log('마이크를 켤 수 없어요: '+(e&&e.name||e))}
};
document.getElementById('stop').onclick=function(){
  cancelAnimationFrame(raf);if(rec){try{rec.stop()}catch(e){}rec=null}
  if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}if(ac){ac.close();ac=null}
  hz.textContent='–';dbEl.textContent='–';document.getElementById('msg').textContent='마이크를 켜 주세요';log('멈춤');
};
</script></body></html>
