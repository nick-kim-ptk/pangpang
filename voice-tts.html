<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>팽팽이 목소리 테스트</title>
<style>
  body{margin:0;font:16px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f6f7f4;color:#1d2a1f;padding:20px 16px 40px}
  main{max-width:560px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  p.s{margin:0 0 16px;color:#5b6b5e;font-size:14px}
  label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
  textarea,input{width:100%;box-sizing:border-box;font:inherit;padding:12px;border:1px solid #c9d3c9;border-radius:12px;background:#fff}
  textarea{min-height:96px;resize:vertical}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 18px;background:#2e9e4f;color:#fff;width:100%;margin-top:14px}
  button.g{background:#e3eae3;color:#1d2a1f;margin-top:8px}
  button:disabled{opacity:.5}
  #st{margin-top:14px;font-size:14px;white-space:pre-wrap}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chips button{width:auto;margin:0;padding:8px 12px;font-weight:500;font-size:14px;background:#e3eae3;color:#1d2a1f}
  .log{margin-top:16px;font-size:13px;color:#5b6b5e}
</style></head><body><main>
<h1>목소리 테스트</h1>
<p class="s">문장을 쓰고 누르면 Fish Audio 목소리로 읽어 줘요. 앱 본체와는 별개예요.</p>

<div id="login" hidden>
  <p>먼저 팽팽이 앱에서 로그인한 뒤 이 페이지를 다시 열어 주세요.</p>
</div>

<div id="box" hidden>
  <label for="t">읽을 문장 (최대 200자)</label>
  <textarea id="t">你好！今天天气很好，我们一起去公园玩吧。</textarea>
  <div class="chips" id="ex"></div>
  <label for="v">목소리 ID (비워 두면 기본 목소리)</label>
  <input id="v" placeholder="Fish Audio 목소리 페이지의 ID" autocomplete="off">
  <label for="sp">속도 <span id="spv">1.0</span></label>
  <input id="sp" type="range" min="0.6" max="1.5" step="0.1" value="1">
  <button id="go">읽어 줘요</button>
  <button id="again" class="g" disabled>다시 듣기</button>
  <div id="st"></div>
  <div class="log" id="log"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function(){
  var cfg = window.APP_CONFIG || {};
  var $ = function(id){ return document.getElementById(id); };
  var sb = (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase)
    ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {auth:{persistSession:true,autoRefreshToken:true}}) : null;
  var EX = ['你好！今天天气很好，我们一起去公园玩吧。','请问，去地铁站怎么走？','我想点一杯热咖啡，不要糖。','你周末一般做什么？我喜欢在家看电影。'];
  EX.forEach(function(s){ var b=document.createElement('button'); b.textContent=s.slice(0,8)+'…'; b.onclick=function(){ $('t').value=s; }; $('ex').appendChild(b); });
  $('sp').oninput = function(){ $('spv').textContent = Number($('sp').value).toFixed(1); };
  try { $('v').value = localStorage.getItem('fishVoice') || ''; } catch(e){}
  var url = null, token = null;
  function say(m){ $('st').textContent = m; }

  function play(){ if(!url) return; var a = new Audio(url); a.play().catch(function(){ say('재생이 막혔어요. 버튼을 한 번 더 눌러 주세요.'); }); }

  $('go').onclick = async function(){
    var text = $('t').value.trim();
    if(!text){ say('문장을 써 주세요.'); return; }
    try { localStorage.setItem('fishVoice', $('v').value.trim()); } catch(e){}
    $('go').disabled = true; say('만드는 중…');
    var t0 = performance.now();
    try {
      var r = await fetch(cfg.SUPABASE_URL + '/functions/v1/fish-tts', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token, 'apikey': cfg.SUPABASE_ANON_KEY },
        body: JSON.stringify({ text:text, voice:$('v').value.trim(), speed:Number($('sp').value) })
      });
      var ms = Math.round(performance.now()-t0);
      if(!r.ok){
        var j = {}; try { j = await r.json(); } catch(e){}
        var why = {no_key:'서버에 FISH_API_KEY가 아직 없어요.', auth:'로그인이 필요해요. 앱에서 다시 로그인해 주세요.', rate:'1분에 8번까지만 돼요. 잠깐 쉬었다가 해 주세요.', fish:'Fish Audio가 거절했어요 ('+(j.status||'')+') '+(j.message||''), network:'Fish Audio에 연결하지 못했어요.'}[j.error];
        say(why || ('실패했어요 ('+r.status+'). 함수가 아직 올라가지 않았을 수 있어요.'));
        return;
      }
      var blob = await r.blob();
      if(url) URL.revokeObjectURL(url);
      url = URL.createObjectURL(blob);
      $('again').disabled = false;
      say('완료! 걸린 시간: 전체 '+(ms/1000).toFixed(1)+'초 (Fish 처리 '+((Number(r.headers.get('X-Fish-Ms'))||0)/1000).toFixed(1)+'초)');
      $('log').textContent = '글자 수 '+text.length+'자 · 파일 '+Math.round(blob.size/1024)+'KB';
      play();
    } catch(e){
      say('연결에 실패했어요. 함수가 올라가 있는지 확인해 주세요.');
    } finally { $('go').disabled = false; }
  };
  $('again').onclick = play;

  (async function(){
    if(!sb){ $('login').hidden = false; $('login').firstElementChild.textContent = '이 페이지는 팽팽이와 같은 주소에서 열어야 해요.'; return; }
    var s = await sb.auth.getSession();
    token = s && s.data && s.data.session && s.data.session.access_token;
    if(token) $('box').hidden = false; else $('login').hidden = false;
    sb.auth.onAuthStateChange(function(_e, ss){ token = ss && ss.access_token; });
  })();
})();
</script>
</main></body></html>
