<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex"><title>따라 말하기 시안</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#f2f4f8;color:#1a2139;font:16px/1.5 system-ui,-apple-system,'Noto Sans KR',sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
.app{position:relative;height:100dvh;display:flex;flex-direction:column;padding:12px 20px calc(28px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;height:44px}.top i{flex:1;height:10px;border-radius:5px;background:#e1e5ee;overflow:hidden}.top i b{display:block;width:7%;height:100%;background:#eccd4c}
.top span{font-weight:800;font-size:13px;background:#e7eaf2;border-radius:99px;padding:6px 12px}.x{width:28px;font-size:26px;line-height:1}
.head{margin-top:14px;font-weight:800}.head em{float:right;font-style:normal;font-size:13px;color:#6b7596;font-weight:700}
.steps{display:flex;justify-content:space-between;margin:22px 0 0;position:relative}.steps:before{content:"";position:absolute;left:16%;right:16%;top:14px;height:3px;background:#e1e5ee}
.steps div{flex:1;text-align:center;font-size:12.5px;font-weight:700;color:#6b7596;position:relative}.steps b{display:grid;place-items:center;width:29px;height:29px;margin:0 auto 4px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px #e1e5ee;font-size:14px}
.steps .on{color:#1a2139}.steps .on b{background:#eccd4c;box-shadow:0 0 0 4px rgba(236,205,76,.35)}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:30}
.card{position:relative;background:#fff;border-radius:22px;padding:28px 22px 22px;box-shadow:inset 0 0 0 1.5px #e1e5ee;text-align:center}
.chunks{display:flex;justify-content:center;gap:6px}.ch{display:grid;gap:2px;padding:8px 10px;border-radius:14px;background:#eceff5}
.ch b{font-size:28px;font-weight:800;line-height:1.25}.ch span{font-size:13px;font-weight:700;color:#4a5578}
.hint{margin-top:14px;font-size:13px;color:#8a93b0}.ko{margin-top:10px;font-size:18px}
.heard{min-height:24px;margin-top:14px;text-align:center;font-size:14px;color:#6b7596}
.dim{position:fixed;inset:0;z-index:20;background:linear-gradient(to bottom,rgba(10,16,34,.62),rgba(10,16,34,.82));opacity:0;pointer-events:none;transition:opacity .25s}
.rec .dim{opacity:1}
canvas{position:fixed;left:0;right:0;bottom:0;width:100%;height:46dvh;z-index:25;pointer-events:none;opacity:0;transition:opacity .25s}.rec canvas{opacity:1}
.foot{position:relative;z-index:40;display:grid;justify-items:center;gap:10px;min-height:150px;align-content:end}
.live{font-size:15px;color:#6b7596;font-weight:600;transition:color .2s;text-align:center}.rec .live{color:#fff;font-weight:800;font-size:17px}
.mic{width:84px;height:84px;border:0;border-radius:50%;background:#eccd4c;display:grid;place-items:center;box-shadow:0 8px 24px rgba(236,205,76,.45);transition:transform .2s cubic-bezier(.2,1.4,.4,1);touch-action:none;touch-callout:none;-webkit-touch-callout:none}
.mic svg{width:34px;height:34px}.rec .mic{transform:scale(1.18)}
</style></head><body>
<div class="app" id="app">
  <div class="top"><span class="x">×</span><i><b></b></i><span>1/14</span></div>
  <div class="head">📦 택배 받기 <em>1번째 문장</em></div>
  <div class="steps"><div class="on"><b>1</b>따라 말하기</div><div><b>2</b>빈칸 채우기</div><div><b>3</b>듣고 고르기</div></div>
  <div class="main"><div class="card"><div class="chunks"><div class="ch"><b>快递</b><span>kuàidì</span></div><div class="ch"><b>到了</b><span>dào le</span></div><div class="ch"><b>吗？</b><span>ma</span></div></div>
    <div class="hint">덩어리를 누르면 소리와 뜻이 나와요</div><div class="ko">택배 왔어요?</div></div>
    <div class="heard" id="heard"></div></div>
  <div class="foot"><div class="live" id="live">버튼을 누른 채로 따라 말해요</div>
    <button class="mic" id="mic" aria-label="누른 채로 말하기"><svg viewBox="0 0 24 24" fill="none" stroke="#1a2139" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="#1a2139"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div>
</div>
<div class="dim"></div><canvas id="cv" width="900" height="900"></canvas>
<script>
var app=document.getElementById('app'),cv=document.getElementById('cv'),cx=cv.getContext('2d'),mic=document.getElementById('mic'),live=document.getElementById('live'),heard=document.getElementById('heard');
var ac,an,stream,raf,buf,rec,hist=[],floor=0,amp=0,ph=0,hue=48,hzS=0,lastVoice=0,holding=false,SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function pitch(b,sr){var n=b.length,rms=0,i,lag;for(i=0;i<n;i++)rms+=b[i]*b[i];rms=Math.sqrt(rms/n);if(rms<0.02)return{f:0,rms:rms};
  var minL=Math.floor(sr/500),maxL=Math.floor(sr/70),best=0,bl=0;
  for(lag=minL;lag<=maxL;lag++){var s=0;for(i=0;i<n-lag;i+=2)s+=b[i]*b[i+lag];if(s>best){best=s;bl=lag}}
  var e0=0;for(i=0;i<n;i+=2)e0+=b[i]*b[i];if(!bl||best/e0<0.6)return{f:0,rms:rms};return{f:sr/bl,rms:rms}}
function draw(){
  an.getFloatTimeDomainData(buf);var r=pitch(buf,ac.sampleRate),rms=r.rms;
  hist.push(rms);if(hist.length>180)hist.shift();var mn=Math.min.apply(null,hist);floor=floor?floor+(Math.max(mn,0.003)-floor)*(mn<floor?0.3:0.02):0.008;
  var voiced=rms>Math.max(floor*3,0.025),over=voiced?20*Math.log10(rms/(floor*3)):0,lvl=Math.max(0,Math.min(1,over/22));if(!voiced)r.f=0;
  amp+=(lvl-amp)*(lvl>amp?0.18:0.07);
  if(r.f){hzS=hzS?hzS+(r.f-hzS)*0.25:r.f;lastVoice=performance.now()}else if(performance.now()-lastVoice>400)hzS=0;
  var tgt=hzS?Math.max(0,Math.min(1,(Math.log2(hzS)-6.8)/1.8)):0.35;hue+=((hzS?200-tgt*160:48)-hue)*0.12;ph+=0.04+amp*0.12+tgt*0.03;
  var w=cv.width,h=cv.height,mid=h*0.5;cx.clearRect(0,0,w,h);cx.globalCompositeOperation='lighter';
  [[1,0,0.9,1],[1.6,1.7,0.6,0.8],[2.3,3.1,0.4,0.6]].forEach(function(l,k){cx.beginPath();
    for(var x=0;x<=w;x+=6){var u=x/w,env=Math.pow(Math.sin(Math.PI*u),1.5),y=mid+Math.sin(u*Math.PI*2*l[0]*1.4+ph*(k%2?-1:1)*l[3]+l[1])*env*(6+amp*h*0.3)*l[2];x?cx.lineTo(x,y):cx.moveTo(x,y)}
    var hh=hue+k*22;cx.strokeStyle='hsla('+hh+',92%,'+(60+amp*10)+'%,'+(0.4+amp*0.55)+')';cx.lineWidth=6-k*1.4+amp*6;cx.lineJoin='round';cx.shadowColor='hsl('+hh+',95%,60%)';cx.shadowBlur=16+amp*30;cx.stroke()});
  cx.shadowBlur=0;cx.globalCompositeOperation='source-over';
  live.textContent=!voiced&&!hzS?'듣고 있어요…':amp<0.25?'조금 더 크게 말해 보세요':amp>0.97?'조금 작게 말해 보세요':'좋아요!';
  raf=requestAnimationFrame(draw)}
async function start(){
  if(holding)return;holding=true;document.body.classList.add('rec');heard.textContent='';live.textContent='듣고 있어요…';if(navigator.vibrate)navigator.vibrate(12);
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:false}});
    if(!holding){stop();return}
    ac=new(window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=2048;buf=new Float32Array(an.fftSize);ac.createMediaStreamSource(stream).connect(an);hist=[];floor=0;amp=0;draw();
    if(SR){rec=new SR();rec.lang='zh-CN';rec.interimResults=true;rec.continuous=true;rec.onresult=function(e){var t='';for(var i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;heard.textContent='들린 말: '+t};rec.onerror=function(){};try{rec.start()}catch(e){}}
  }catch(e){live.textContent='마이크를 켤 수 없어요'}}
function stop(){holding=false;document.body.classList.remove('rec');cancelAnimationFrame(raf);
  if(rec){try{rec.stop()}catch(e){}rec=null}if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}if(ac){ac.close();ac=null}
  live.textContent='버튼을 누른 채로 따라 말해요'}
mic.addEventListener('pointerdown',function(e){e.preventDefault();try{mic.setPointerCapture(e.pointerId)}catch(x){}start()});
['pointerup','pointercancel'].forEach(function(n){mic.addEventListener(n,function(){if(holding)stop()})});
mic.addEventListener('contextmenu',function(e){e.preventDefault()});
</script></body></html>
