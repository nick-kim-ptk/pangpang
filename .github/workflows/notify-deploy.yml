# 테스트용: main에 올리면 실제 사이트에 새 버전이 보일 때까지 기다렸다가 폰(ntfy)으로 알려 줘요.
# 필요 없어지면 이 파일만 지우면 돼요. (GitHub Secrets에 NTFY_TOPIC 필요)
name: notify-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 배포 반영을 기다렸다가 알림
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "${NTFY_TOPIC}" ]; then echo "NTFY_TOPIC secret이 없어서 알림을 건너뛰어요"; exit 0; fi
          WANT=$(grep -o "APP_VERSION = '[^']*'" app.js | head -1 | sed "s/.*'\(.*\)'/\1/")
          OWNER=${GITHUB_REPOSITORY%%/*}; REPO=${GITHUB_REPOSITORY##*/}
          URL="https://${OWNER}.github.io/${REPO}/app.js"
          GOT=""
          for i in $(seq 1 40); do
            GOT=$(curl -fsS -H 'Cache-Control: no-cache' "${URL}?t=$(date +%s)" | grep -o "APP_VERSION = '[^']*'" | head -1 | sed "s/.*'\(.*\)'/\1/" || true)
            if [ "$GOT" = "$WANT" ]; then break; fi
            sleep 15
          done
          if [ "$GOT" = "$WANT" ]; then MSG="팽팽이 ${WANT} 반영됐어요. 앱을 열어 확인해 보세요."; else MSG="팽팽이 ${WANT} 배포 확인이 10분 넘게 걸려요. GitHub Actions를 확인해 주세요."; fi
          curl -fsS -d "$MSG" "https://ntfy.sh/${NTFY_TOPIC}"
